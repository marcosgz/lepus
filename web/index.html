<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <base href="__BASE_PATH__" />
  <title>Lepus</title>
  <link rel="preload" href="assets/fonts/overpass/overpass-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/js/theme.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="bar">
    <a class="brand" href="./">
      <svg class="brand-mark" viewBox="0 0 64 64" width="24" height="24" aria-hidden="true">
        <path class="brand-l" d="M12 6V40A16 16 0 0 0 28 56H42A10 10 0 0 0 42 36H28V18"/>
        <circle class="brand-dot" cx="40" cy="46" r="5"/>
      </svg>
      <span>Lepus</span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#map" data-nav="map">Map</a>
      <a href="#queues" data-nav="queues">Queues</a>
      <a href="#processes" data-nav="processes">Processes</a>
      <a href="#connections" data-nav="connections">Connections</a>
    </nav>
    <div class="bar-tools">
      <div class="poll" id="poll">
        <button type="button" class="live" id="live" aria-expanded="false" aria-controls="poll-menu">
          <span class="live-dot" aria-hidden="true"></span><span class="live-text">Live</span><span class="live-rate"></span>
          <svg class="live-caret" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 3.5l3 3 3-3"/></svg>
        </button>
        <div class="poll-menu" id="poll-menu" hidden>
          <fieldset>
            <legend>Refresh</legend>
            <div class="poll-options" id="poll-options"></div>
          </fieldset>
          <p class="poll-note">Updates also pause while this tab is in the background.</p>
        </div>
      </div>
      <div class="theme" role="group" aria-label="Color theme">
        <button type="button" data-theme-choice="auto" aria-label="Match system theme" title="Match system">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" class="fill"/></svg>
        </button>
        <button type="button" data-theme-choice="light" aria-label="Light theme" title="Light">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/></svg>
        </button>
        <button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13 10.2A5.6 5.6 0 0 1 5.8 3a5.6 5.6 0 1 0 7.2 7.2z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="view" class="view" tabindex="-1">
    <p class="loading">Reading the broker</p>
  </main>
</body>
</html>
